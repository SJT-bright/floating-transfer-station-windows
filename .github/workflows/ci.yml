name: Windows build and acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FTS_UI_ARTIFACTS: ${{ github.workspace }}\artifacts\evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FloatingTransferStation.slnx
      - name: Format and retain formatting patch
        run: |
          dotnet format FloatingTransferStation.slnx --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/evidence | Out-Null
          git diff --output=artifacts/evidence/format.patch
      - name: Strict build
        run: dotnet build FloatingTransferStation.slnx -c Release --no-restore -warnaserror
      - name: Windows regression and rendered UI
        run: dotnet test FloatingTransferStation.slnx -c Release --no-build --logger "trx;LogFileName=windows.trx"
      - name: Build self-contained installer
        run: ./scripts/build-release.ps1
      - name: Package and installation smoke test
        run: ./scripts/test-windows-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: |
            artifacts/evidence/
            artifacts/release/
            **/TestResults/*.trx
          if-no-files-found: error
